name: Apply framework stability patch

on:
  push:
    branches: [feat/million-message-lab]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply atomic snapshot and viewport fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          viewport = Path('src/components/ConversationViewport.vue')
          text = viewport.read_text()
          text = text.replace(
              "import { computed, nextTick, onBeforeUnmount, onMounted, ref, shallowRef } from 'vue'",
              "import { computed, nextTick, onBeforeUnmount, onMounted, ref, shallowRef, watch } from 'vue'",
              1,
          )
          text = text.replace(
              "const props = defineProps<{ runtime: ConversationSessionRuntime; stream: SyntheticStreamController; diagnostics?: boolean }>()",
              "const props = defineProps<{ runtime: ConversationSessionRuntime; stream: SyntheticStreamController; uiState: SessionUiSnapshot; diagnostics?: boolean }>()",
              1,
          )
          text = text.replace(
              "const uiState = shallowRef<SessionUiSnapshot>(props.runtime.uiSnapshot)\nlet lastStreamTick = uiState.value.streamRenderTicks",
              "const uiState = computed(() => props.uiState)",
              1,
          )
          text = text.replace("let unsubscribeState: (() => void) | null = null\n", "", 1)

          old_scroll = '''    lastScrollOffset = list.scrollOffset
              if (semanticTailNavigation) updateReader(lastScrollOffset)
              else props.runtime.setReaderPosition(target, false)
              await settleFrames(1)
              if (!targetIsCommittedVisible(target)) continue
              if (semanticTailNavigation) rememberCommittedAnchor()
              else {
                const anchor = captureCommittedAnchor()
                if (anchor) lastCommittedAnchor = anchor
              }
              return'''
          new_scroll = '''    lastScrollOffset = list.scrollOffset
              if (semanticTailNavigation) updateReader(lastScrollOffset)
              else props.runtime.setReaderPosition(target, false)
              // A programmatic jump is not committed until the virtualizer has held the
              // same semantic target through several measurement frames. Responsive
              // reflow must restore this stable coordinate, not an intermediate probe.
              await settleFrames(VIEWPORT_POLICY.stableLayoutFrames)
              if (!targetIsCommittedVisible(target)) continue
              if (semanticTailNavigation) rememberCommittedAnchor()
              else {
                const anchor = captureCommittedAnchor()
                if (anchor) lastCommittedAnchor = anchor
              }
              return'''
          if old_scroll not in text:
              raise SystemExit('scroll commit block not found')
          text = text.replace(old_scroll, new_scroll, 1)

          old_mount = '''onMounted(() => {
            unsubscribeOrder = props.runtime.projection.subscribeOrder(() => { order.value = [...props.runtime.projection.order] })
            unsubscribeState = props.runtime.subscribeState(() => {
              const next = props.runtime.uiSnapshot; uiState.value = next
              if (next.streamRenderTicks !== lastStreamTick) {
                lastStreamTick = next.streamRenderTicks
                if (next.followTail) void nextTick().then(() => listRef.value?.scrollToIndex(Math.max(0, order.value.length - 1), { align: 'end' }))
              }
            })
            resizeComposer(); void restoreSnapshot().then(attachViewportObserver)
          })

          onBeforeUnmount(() => {
            props.runtime.setDraftText(composerText.value); props.runtime.rememberSnapshot(captureSnapshot())
            unsubscribeOrder?.(); unsubscribeState?.(); viewportObserver?.disconnect()'''
          new_mount = '''watch(() => props.uiState.streamRenderTicks, (next, previous) => {
            if (next === previous || !props.uiState.followTail) return
            void nextTick().then(() => listRef.value?.scrollToIndex(Math.max(0, order.value.length - 1), { align: 'end' }))
          })

          onMounted(() => {
            unsubscribeOrder = props.runtime.projection.subscribeOrder(() => { order.value = [...props.runtime.projection.order] })
            resizeComposer(); void restoreSnapshot().then(attachViewportObserver)
          })

          onBeforeUnmount(() => {
            props.runtime.setDraftText(composerText.value); props.runtime.rememberSnapshot(captureSnapshot())
            unsubscribeOrder?.(); viewportObserver?.disconnect()'''
          if old_mount not in text:
              raise SystemExit('viewport mount subscription block not found')
          text = text.replace(old_mount, new_mount, 1)
          viewport.write_text(text)

          workspace = Path('src/components/AgentWorkspace.vue')
          text = workspace.read_text()
          old = '    <ConversationViewport :key="activeSession.id" ref="viewportRef" :runtime="activeSession" :stream="activeStream" :diagnostics="diagnosticsOpen" />'
          new = '    <ConversationViewport :key="activeSession.id" ref="viewportRef" :runtime="activeSession" :stream="activeStream" :ui-state="activeUiState" :diagnostics="diagnosticsOpen" />'
          if old not in text:
              raise SystemExit('AgentWorkspace viewport binding not found')
          workspace.write_text(text.replace(old, new, 1))

          layout = Path('e2e/layout-integrity.spec.ts')
          text = layout.read_text()
          old = '''  const wrapperGeometry = await page.locator('[data-virtual-item="true"]').first().evaluate(element => {
            const style = getComputedStyle(element)
            return { paddingTop: style.paddingTop, paddingBottom: style.paddingBottom, marginTop: style.marginTop, marginBottom: style.marginBottom }
          })
          expect(wrapperGeometry).toEqual({ paddingTop: '0px', paddingBottom: '0px', marginTop: '0px', marginBottom: '0px' })'''
          new = '''  const wrapperGeometry = await page.getByTestId('scrollport').evaluate(stage => {
            const viewport = stage.getBoundingClientRect()
            const element = [...stage.querySelectorAll<HTMLElement>('[data-virtual-item="true"]')]
              .find(row => {
                const rect = row.getBoundingClientRect()
                return rect.height > 0 && rect.bottom > viewport.top && rect.top < viewport.bottom
              })
            if (!element) return null
            const style = getComputedStyle(element)
            return { paddingTop: style.paddingTop, paddingBottom: style.paddingBottom, marginTop: style.marginTop, marginBottom: style.marginBottom }
          })
          expect(wrapperGeometry).toEqual({ paddingTop: '0px', paddingBottom: '0px', marginTop: '0px', marginBottom: '0px' })'''
          if old not in text:
              raise SystemExit('layout wrapper assertion block not found')
          layout.write_text(text.replace(old, new, 1))

          million = Path('e2e/million-message.spec.ts')
          text = million.read_text()
          old = "  expect(numeric(await page.getByTestId('messages-after-metric').textContent())).toBe(expected)"
          new = "  await expect.poll(async () => numeric(await page.getByTestId('messages-after-metric').textContent())).toBe(expected)"
          if old not in text:
              raise SystemExit('messages-after metric assertion not found')
          million.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git rm .github/workflows/apply-framework-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/ConversationViewport.vue src/components/AgentWorkspace.vue e2e/layout-integrity.spec.ts e2e/million-message.spec.ts
          git commit -m "fix: publish one atomic session snapshot to the viewport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
