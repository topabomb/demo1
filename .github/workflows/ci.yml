name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-framework:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply framework semantics and stability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          # One reactive owner: Vue bridge publishes an atomic SessionUiSnapshot;
          # the viewport consumes it instead of mirroring the same runtime subscription.
          replace('src/components/ConversationViewport.vue',
              "import { computed, nextTick, onBeforeUnmount, onMounted, ref, shallowRef } from 'vue'",
              "import { computed, nextTick, onBeforeUnmount, onMounted, ref, shallowRef, watch } from 'vue'")
          replace('src/components/ConversationViewport.vue',
              "const props = defineProps<{ runtime: ConversationSessionRuntime; stream: SyntheticStreamController; diagnostics?: boolean }>()",
              "const props = defineProps<{ runtime: ConversationSessionRuntime; stream: SyntheticStreamController; uiState: SessionUiSnapshot; diagnostics?: boolean }>()")
          replace('src/components/ConversationViewport.vue',
              "const uiState = shallowRef<SessionUiSnapshot>(props.runtime.uiSnapshot)\nlet lastStreamTick = uiState.value.streamRenderTicks",
              "const uiState = computed(() => props.uiState)")
          replace('src/components/ConversationViewport.vue', "let unsubscribeState: (() => void) | null = null\n", "")
          replace('src/components/ConversationViewport.vue',
              "    lastScrollOffset = list.scrollOffset; updateReader(lastScrollOffset); await settleFrames(1)\n    if (targetIsCommittedVisible(target) && Math.abs(props.runtime.currentLogicalPosition - target) < 64) { rememberCommittedAnchor(); return }",
              "    lastScrollOffset = list.scrollOffset; updateReader(lastScrollOffset); await settleFrames(VIEWPORT_POLICY.stableLayoutFrames)\n    if (targetIsCommittedVisible(target) && Math.abs(props.runtime.currentLogicalPosition - target) < 64) { rememberCommittedAnchor(); return }") if False else None

          # Current branch already separates explicit semantic jump from tail navigation;
          # hold the target through stable measurement frames before committing its anchor.
          replace('src/components/ConversationViewport.vue',
              "    lastScrollOffset = list.scrollOffset\n    if (semanticTailNavigation) updateReader(lastScrollOffset)\n    else props.runtime.setReaderPosition(target, false)\n    await settleFrames(1)\n    if (!targetIsCommittedVisible(target)) continue",
              "    lastScrollOffset = list.scrollOffset\n    if (semanticTailNavigation) updateReader(lastScrollOffset)\n    else props.runtime.setReaderPosition(target, false)\n    await settleFrames(VIEWPORT_POLICY.stableLayoutFrames)\n    if (!targetIsCommittedVisible(target)) continue")

          old_mount = """onMounted(() => {
  unsubscribeOrder = props.runtime.projection.subscribeOrder(() => { order.value = [...props.runtime.projection.order] })
  unsubscribeState = props.runtime.subscribeState(() => {
    const next = props.runtime.uiSnapshot; uiState.value = next
    if (next.streamRenderTicks !== lastStreamTick) {
      lastStreamTick = next.streamRenderTicks
      if (next.followTail) void nextTick().then(() => listRef.value?.scrollToIndex(Math.max(0, order.value.length - 1), { align: 'end' }))
    }
  })
  resizeComposer(); void restoreSnapshot().then(attachViewportObserver)
})

onBeforeUnmount(() => {
  props.runtime.setDraftText(composerText.value); props.runtime.rememberSnapshot(captureSnapshot())
  unsubscribeOrder?.(); unsubscribeState?.(); viewportObserver?.disconnect()"""
          new_mount = """watch(() => props.uiState.streamRenderTicks, (next, previous) => {
  if (next === previous || !props.uiState.followTail) return
  void nextTick().then(() => listRef.value?.scrollToIndex(Math.max(0, order.value.length - 1), { align: 'end' }))
})

onMounted(() => {
  unsubscribeOrder = props.runtime.projection.subscribeOrder(() => { order.value = [...props.runtime.projection.order] })
  resizeComposer(); void restoreSnapshot().then(attachViewportObserver)
})

onBeforeUnmount(() => {
  props.runtime.setDraftText(composerText.value); props.runtime.rememberSnapshot(captureSnapshot())
  unsubscribeOrder?.(); viewportObserver?.disconnect()"""
          replace('src/components/ConversationViewport.vue', old_mount, new_mount)
          replace('src/components/AgentWorkspace.vue',
              '    <ConversationViewport :key="activeSession.id" ref="viewportRef" :runtime="activeSession" :stream="activeStream" :diagnostics="diagnosticsOpen" />',
              '    <ConversationViewport :key="activeSession.id" ref="viewportRef" :runtime="activeSession" :stream="activeStream" :ui-state="activeUiState" :diagnostics="diagnosticsOpen" />')

          # Canonical semantics: Turn/Step are explicit coordinates; demo generator metadata
          # is optional compatibility rather than required domain data.
          replace('src/model/conversation.ts',
              "  turnId: string\n  role: LogicalRole",
              "  turnId: string\n  stepId?: string\n  role: LogicalRole")
          replace('src/model/conversation.ts',
              "  seed: number\n  intensity: number",
              "  seed?: number\n  intensity?: number")
          replace('src/model/conversation.ts',
              "export interface AppendCanonicalMessage {\n  turnId: string\n  role: LogicalRole",
              "export interface AppendCanonicalMessage {\n  turnId: string\n  stepId?: string\n  role: LogicalRole")

          # Renderer-ready identity is explicit; renderers never need to inspect Session state.
          replace('src/presentation/render-unit.ts',
              "  messageIndex: number\n  kind: RenderKind",
              "  messageIndex: number\n  turnId: string\n  stepId?: string\n  blockId: string\n  kind: RenderKind")
          replace('src/presentation/projector-registry.ts',
              "  const { seed, intensity } = message",
              "  const seed = message.seed ?? 0\n  const intensity = message.intensity ?? 5")
          replace('src/presentation/projector-registry.ts',
              "    const callId = `call_${Math.floor(message.index / 2).toString(36)}_${seed.toString(36).slice(0, 4)}`",
              "    const pairIndex = phase === 'result' ? Math.max(0, message.index - 1) : message.index\n    const callId = `call_${pairIndex.toString(36)}_${name}`")
          replace('src/presentation/projector-registry.ts',
              "    messageIndex: message.index,\n    kind,",
              "    messageIndex: message.index,\n    turnId: message.turnId,\n    stepId: message.stepId,\n    blockId: contentBlock.id,\n    kind,")

          # Ordered live change feed: mutations are applied in order while publication stays
          # microtask-batched. `lastEvent` remains a compatibility/debug view only.
          replace('src/conversation/session-kernel.ts', "import { hash32 } from '../core/prng'\n", "")
          replace('src/conversation/session-kernel.ts',
              "export interface SessionKernelEvent {\n  kind: SessionKernelEventKind\n  messageIndex?: number\n  contentPatch?: SessionKernelContentPatch\n}",
              "export interface SessionKernelEvent {\n  seq: number\n  kind: SessionKernelEventKind\n  messageIndex?: number\n  contentPatch?: SessionKernelContentPatch\n}\nexport type SessionKernelChange = Omit<SessionKernelEvent, 'seq'>\nexport type SessionKernelChangeBatch = readonly SessionKernelEvent[]")
          replace('src/conversation/session-kernel.ts',
              "  #notifier = new BatchedNotifier()\n  #lastEvent: SessionKernelEvent = { kind: 'status' }",
              "  #notifier = new BatchedNotifier()\n  #changeListeners = new Set<(changes: SessionKernelChangeBatch) => void>()\n  #pendingChanges: SessionKernelEvent[] = []\n  #changesScheduled = false\n  #changeSeq = 0\n  #lastEvent: SessionKernelEvent = { seq: 0, kind: 'status' }")
          replace('src/conversation/session-kernel.ts',
              "  subscribe(listener: () => void): Unsubscribe { return this.#notifier.subscribe(listener) }\n  get lastEvent(): SessionKernelEvent { return this.#lastEvent }",
              "  subscribe(listener: () => void): Unsubscribe { return this.#notifier.subscribe(listener) }\n  subscribeChanges(listener: (changes: SessionKernelChangeBatch) => void): Unsubscribe {\n    this.#changeListeners.add(listener)\n    return () => this.#changeListeners.delete(listener)\n  }\n  /** Compatibility/debug snapshot. Incremental consumers must use subscribeChanges(). */\n  get lastEvent(): SessionKernelEvent { return this.#lastEvent }")
          replace('src/conversation/session-kernel.ts',
              "        turnId: entry.turnId,\n        role: entry.role,",
              "        turnId: entry.turnId,\n        stepId: entry.stepId,\n        role: entry.role,")
          replace('src/conversation/session-kernel.ts',
              "        seed: hash32(index + this.seedOffset),\n        intensity: 5,\n",
              "")
          replace('src/conversation/session-kernel.ts',
              "    const turnId = `${this.id}:runtime-turn-${userIndex}`\n    this.#appended.push({",
              "    const turnId = `${this.id}:runtime-turn-${userIndex}`\n    const stepId = `${turnId}:step-0`\n    this.#appended.push({")
          replace('src/conversation/session-kernel.ts',
              "      turnId,\n      role: 'user',",
              "      turnId,\n      stepId,\n      role: 'user',", 1)
          replace('src/conversation/session-kernel.ts',
              "      seed: hash32(userIndex + this.seedOffset),\n      intensity: 3,\n",
              "")
          replace('src/conversation/session-kernel.ts',
              "      turnId,\n      role: 'assistant',",
              "      turnId,\n      stepId,\n      role: 'assistant',", 1)
          replace('src/conversation/session-kernel.ts',
              "      seed: hash32(assistantIndex + this.seedOffset),\n      intensity: 5,\n",
              "")
          replace('src/conversation/session-kernel.ts',
              "  #touchUnread(): void { if (!this.#foreground) this.#unread = true }\n  #emit(event: SessionKernelEvent, markUnread = true): void { this.#lastEvent = event; if (markUnread) this.#touchUnread(); this.#notifier.markDirty() }",
              "  #touchUnread(): void { if (!this.#foreground) this.#unread = true }\n  #emit(change: SessionKernelChange, markUnread = true): void {\n    const event: SessionKernelEvent = { ...change, seq: ++this.#changeSeq }\n    this.#lastEvent = event\n    this.#pendingChanges.push(event)\n    if (!this.#changesScheduled) {\n      this.#changesScheduled = true\n      queueMicrotask(() => {\n        this.#changesScheduled = false\n        const changes = this.#pendingChanges\n        this.#pendingChanges = []\n        if (changes.length > 0) for (const listener of this.#changeListeners) listener(changes)\n      })\n    }\n    if (markUnread) this.#touchUnread()\n    this.#notifier.markDirty()\n  }")

          # Hot presentation consumes the ordered batch and never assumes a single last mutation.
          replace('src/conversation/session-runtime.ts',
              "import type { ConversationSessionKernel } from './session-kernel'",
              "import type { ConversationSessionKernel, SessionKernelEvent } from './session-kernel'")
          replace('src/conversation/session-runtime.ts',
              "    this.#kernelUnsubscribe = kernel.subscribe(() => this.#syncKernel())",
              "    this.#kernelUnsubscribe = kernel.subscribeChanges(changes => this.#syncKernel(changes))")
          old_sync = """  #syncKernel(): void {
    const event = this.kernel.lastEvent
    const oldCount = this.#knownLogicalCount
    const newCount = this.logicalCount

    if (newCount !== oldCount) {
      const wasPinned = this.followTail || this.atVisualBottom
      this.#knownLogicalCount = newCount
      this.segment.setTotalMessages(newCount)
      if (Math.ceil(Math.max(1, newCount) / DEFAULT_PAGE_SIZE) !== this.pageHeights.pageCount) this.pageHeights = new PageHeightIndex(newCount)
      if (wasPinned && newCount > 0) {
        this.segment.setEndingAt(newCount - 1)
        this.currentLogicalPosition = newCount - 1
        this.atVisualBottom = true
        this.#activeUnits = this.#materialize(this.range)
        this.#refreshPageEstimates()
        this.projection.replace(this.#activeUnits)
      }
    }

    if (event.messageIndex !== undefined && event.messageIndex >= this.range.start && event.messageIndex < this.range.end) {
      const message = this.kernel.getMessage(event.messageIndex)
      const units = event.contentPatch?.kind === 'append-markdown'
        ? this.projectionEngine.appendMarkdownDelta(message, event.contentPatch.blockId, event.contentPatch.delta)
        : this.projectionEngine.projectMessage(message)
      const existing = this.#activeUnits.filter(unit => unit.messageIndex === event.messageIndex)
      const sameIds = existing.length === units.length && existing.every((unit, index) => unit.id === units[index]?.id)
      if (sameIds) {
        const byId = new Map(units.map(unit => [unit.id, unit]))
        this.#activeUnits = this.#activeUnits.map(unit => byId.get(unit.id) ?? unit)
        for (const unit of units) this.projection.patch(unit)
      } else {
        const before = this.#activeUnits.filter(unit => unit.messageIndex < event.messageIndex!)
        const after = this.#activeUnits.filter(unit => unit.messageIndex > event.messageIndex!)
        this.#activeUnits = [...before, ...units, ...after]
        this.projection.replace(this.#activeUnits)
      }
    }

    this.#stateNotifier.markDirty()
  }"""
          new_sync = """  #syncKernel(changes: readonly SessionKernelEvent[]): void {
    const oldCount = this.#knownLogicalCount
    const newCount = this.logicalCount

    if (newCount !== oldCount) {
      const wasPinned = this.followTail || this.atVisualBottom
      this.#knownLogicalCount = newCount
      this.segment.setTotalMessages(newCount)
      if (Math.ceil(Math.max(1, newCount) / DEFAULT_PAGE_SIZE) !== this.pageHeights.pageCount) this.pageHeights = new PageHeightIndex(newCount)
      if (wasPinned && newCount > 0) {
        this.segment.setEndingAt(newCount - 1)
        this.currentLogicalPosition = newCount - 1
        this.atVisualBottom = true
        this.#activeUnits = this.#materialize(this.range)
        this.#refreshPageEstimates()
        this.projection.replace(this.#activeUnits)
      }
    }

    for (const event of changes) {
      if (event.messageIndex === undefined || event.messageIndex < this.range.start || event.messageIndex >= this.range.end) continue
      const message = this.kernel.getMessage(event.messageIndex)
      const units = event.contentPatch?.kind === 'append-markdown'
        ? this.projectionEngine.appendMarkdownDelta(message, event.contentPatch.blockId, event.contentPatch.delta)
        : this.projectionEngine.projectMessage(message)
      const existing = this.#activeUnits.filter(unit => unit.messageIndex === event.messageIndex)
      const sameIds = existing.length === units.length && existing.every((unit, index) => unit.id === units[index]?.id)
      if (sameIds) {
        const byId = new Map(units.map(unit => [unit.id, unit]))
        this.#activeUnits = this.#activeUnits.map(unit => byId.get(unit.id) ?? unit)
        for (const unit of units) this.projection.patch(unit)
      } else {
        const before = this.#activeUnits.filter(unit => unit.messageIndex < event.messageIndex)
        const after = this.#activeUnits.filter(unit => unit.messageIndex > event.messageIndex)
        this.#activeUnits = [...before, ...units, ...after]
        this.projection.replace(this.#activeUnits)
      }
    }

    this.#stateNotifier.markDirty()
  }"""
          replace('src/conversation/session-runtime.ts', old_sync, new_sync)

          # Browser tests read mounted geometry atomically; diagnostics can lag one Vue publish
          # by a microtask but must converge to the exact same semantic snapshot.
          old_wrapper = """  const wrapperGeometry = await page.locator('[data-virtual-item="true"]').first().evaluate(element => {
    const style = getComputedStyle(element)
    return { paddingTop: style.paddingTop, paddingBottom: style.paddingBottom, marginTop: style.marginTop, marginBottom: style.marginBottom }
  })
  expect(wrapperGeometry).toEqual({ paddingTop: '0px', paddingBottom: '0px', marginTop: '0px', marginBottom: '0px' })"""
          new_wrapper = """  const wrapperGeometry = await page.getByTestId('scrollport').evaluate(stage => {
    const viewport = stage.getBoundingClientRect()
    const element = [...stage.querySelectorAll<HTMLElement>('[data-virtual-item="true"]')].find(row => {
      const rect = row.getBoundingClientRect()
      return rect.height > 0 && rect.bottom > viewport.top && rect.top < viewport.bottom
    })
    if (!element) return null
    const style = getComputedStyle(element)
    return { paddingTop: style.paddingTop, paddingBottom: style.paddingBottom, marginTop: style.marginTop, marginBottom: style.marginBottom }
  })
  expect(wrapperGeometry).toEqual({ paddingTop: '0px', paddingBottom: '0px', marginTop: '0px', marginBottom: '0px' })"""
          replace('e2e/layout-integrity.spec.ts', old_wrapper, new_wrapper)
          replace('e2e/million-message.spec.ts',
              "  expect(numeric(await page.getByTestId('messages-after-metric').textContent())).toBe(expected)",
              "  await expect.poll(async () => numeric(await page.getByTestId('messages-after-metric').textContent())).toBe(expected)")

          # Unit proofs for semantic location, ordered changes and stable tool correlation.
          replace('tests/session-kernel.test.ts',
              "    expect(kernel.status).toBe('working')",
              "    expect(kernel.getMessage(100).stepId).toBe(kernel.getMessage(101).stepId)\n    expect(kernel.getMessage(100).stepId).toBe('resume:runtime-turn-100:step-0')\n    expect(kernel.status).toBe('working')")
          replace('tests/session-kernel.test.ts',
              "  it('queues follow-ups while working instead of coupling them to the viewport', () => {",
              "  it('publishes every live mutation in ordered microtask batches', async () => {\n    const descriptor = { id: 'changes', title: 'Changes', age: 'now', status: 'idle' as const, logicalCount: 0 }\n    const kernel = new ConversationSessionKernel(descriptor, new SyntheticHistoryAdapter('changes', 0), 1)\n    const batches: number[][] = []\n    const kinds: string[][] = []\n    const unsubscribe = kernel.subscribeChanges(changes => { batches.push(changes.map(change => change.seq)); kinds.push(changes.map(change => change.kind)) })\n    kernel.beginTurn('stream')\n    kernel.appendAssistantDelta('a')\n    kernel.appendAssistantDelta('b')\n    await Promise.resolve()\n    expect(batches).toHaveLength(1)\n    expect(batches[0]).toEqual([...batches[0]!].sort((a, b) => a - b))\n    expect(kinds[0]).toEqual(['append', 'content', 'content'])\n    unsubscribe()\n  })\n\n  it('queues follow-ups while working instead of coupling them to the viewport', () => {")
          replace('tests/projection-engine.test.ts',
              "    expect(second[0]).toBe(first[0])",
              "    expect(second[0]).toBe(first[0])\n    expect(first[0]).toMatchObject({ turnId: 't', blockId: 'answer' })")

          # Stable tool call/result identity is a business invariant, not an ordinal UI guess.
          synthetic_test = Path('tests/synthetic.test.ts')
          text = synthetic_test.read_text()
          marker = "describe('SyntheticConversationSource'"
          # Existing tests already cover the source; add a focused projector assertion before the final suite close.
          if "correlates synthetic tool call/result" not in text:
              insert = """\n\nit('correlates synthetic tool call/result with one stable callId', () => {\n  const source = new SyntheticConversationSource(24, 'tool-id')\n  const call = projectMessage(source.getMessage(2))[0]!\n  const result = projectMessage(source.getMessage(3))[0]!\n  expect(call.payload.callId).toBe(result.payload.callId)\n})\n"""
              text += insert
              synthetic_test.write_text(text)

          # Documentation: adapt Harness invariants, do not copy its plugin/runtime machinery.
          readme = Path('README.md')
          text = readme.read_text()
          influence = """\n## Design influence: DeepSeek Harness\n\nThis template borrows several proven **conversation-runtime invariants** from [DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness) without copying Cordis or its plugin/package system: durable/model facts are upstream of UI, Turn/Step coordinates are explicit, live mutations retain ordered identity, high-frequency publication is coalesced, and renderers consume keyed renderer-ready data rather than scanning Session state. Generic cross-event node assembly is introduced only when a real business row spans multiple events.\n\n"""
          anchor = "## Physical/CSS boundary\n"
          if influence.strip() not in text:
              text = text.replace(anchor, influence + anchor)
              readme.write_text(text)

          review = Path('docs/template-review.md')
          text = review.read_text()
          scene = """\n## Scenario-driven semantics adopted from DeepSeek Harness\n\nThe useful lesson from DeepSeek Harness is not “make everything a plugin”. For this client-side template, the transferable rules are narrower:\n\n| Scenario | Template contract | Deliberately not generalized yet |\n|---|---|---|\n| One model turn streams many visible deltas | `turnId + stepId`, ordered `SessionKernelChangeBatch`, frame-coalesced execution publication | no second event-sourced persistence engine in the browser |\n| Tool call and result arrive as separate records | stable `callId` carried by both sides; renderer-ready units expose stable semantic location | no “latest unfinished tool” lookup or DOM adjacency correlation |\n| Vue shows session state in several siblings | one `useWorkspaceRuntime` snapshot publisher; children receive atomic props | no component-local subscription mirrors |\n| Responsive/composer reflow changes physical geometry | freeze committed semantic anchor/pin intent, then reconcile measurements | no scrollbar position as application truth |\n| A future review/job/deliverable spans many durable events | add a keyed ConversationNode assembler: current-event match → stable business id → deterministic fold → renderer-ready node | no generic assembler until such a row exists |\n| A real capability has multiple providers | introduce a Definition / Provider / Consumer seam | no Cordis-like service graph for this rendering template |\n\nFor a future cross-event Node, preserve Harness's three ingestion invariants: replace/replay must equal incremental append, prepend must preserve unaffected keyed node identity, and live append must update one matched business context without scanning the complete history/window. Renderer code receives final node data only.\n\n"""
          anchor = "## Rendering-efficiency rules\n"
          if scene.strip() not in text:
              text = text.replace(anchor, scene + anchor)
              review.write_text(text)

          architecture = Path('docs/agent-workspace-reference-architecture.md')
          text = architecture.read_text()
          addition = """\n\n## DeepSeek Harness lessons, adapted to this template\n\nDeepSeek Harness provides a useful reference for separating durable facts, live execution events and keyed conversation-node rendering. `demo1` adopts the invariants that fit its scope, not Harness's Cordis/plugin distribution architecture.\n\n**1. Canonical history is upstream of presentation.** Production may expose an append-only event log like Harness and derive `LogicalMessage` snapshots from it; this browser template does not create a competing persistence log. `ConversationHistoryAdapter` remains the cold-history truth, while `SessionKernelChangeBatch` is an ordered live mutation feed for hot consumers.\n\n**2. Turn and Step are semantic coordinates.** A Turn may eventually contain multiple model Steps. The demo's runtime currently executes one Step per user Turn, so both messages share a stable `stepId`. RenderUnits expose `turnId`, `stepId` and `blockId` directly so viewport/renderers never recover business location from DOM order or opaque payload parsing.\n\n**3. Correlation is producer-owned.** Separate tool call/result records share one stable `callId`. A future multi-event business row must carry an equivalent stable ID on every contributing event; never attach an update to “the latest unfinished node”.\n\n**4. Apply every change; coalesce publication.** Kernel changes retain monotonic sequence and are delivered in ordered microtask batches. Streaming ingress is already frame-coalesced by the execution controller. This separates semantic event order from UI publication rate.\n\n**5. One framework subscription boundary.** `useWorkspaceRuntime` converts mutable runtime objects into atomic Vue snapshots. Product components consume those snapshots and do not create parallel subscriptions to the same business object.\n\n**6. Cross-event Conversation Nodes are scenario-triggered.** `ContentProjectorRegistry` is sufficient while one canonical message owns one visual contribution. Introduce a dedicated keyed assembler only when a real feature (for example review progress, long-running job, deliverable lifecycle or retry chain) requires several durable records to become one row. Its required laws are replay equivalence, stable identity through prepend, O(current event) append matching and renderer-ready output.\n\nThis keeps the abstraction centered on actual Agent-conversation scenarios instead of reproducing a general plugin runtime.\n"""
          if "## DeepSeek Harness lessons, adapted to this template" not in text:
              architecture.write_text(text.rstrip() + addition + "\n")

          verification = Path('docs/verification.md')
          text = verification.read_text()
          replace_text = "| Session semantics | live execution is separate from last Turn outcome; error history is resumable |"
          replacement = "| Session semantics | live execution is separate from last Turn outcome; error history is resumable; runtime Turn messages share explicit Step identity |\n| Ordered change feed | multiple same-microtask mutations retain monotonic order and reach hot presentation as one ordered batch |\n| Semantic renderer identity | RenderUnits expose stable Turn/Step/Block coordinates; tool call/result share one producer-owned `callId` |"
          if replace_text in text:
              text = text.replace(replace_text, replacement, 1)
          verification.write_text(text)
          PY

          # Restore the permanent read-only CI and remove the standalone temporary workflow.
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/apply-framework-stability.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            src/model/conversation.ts \
            src/presentation/render-unit.ts \
            src/presentation/projector-registry.ts \
            src/conversation/session-kernel.ts \
            src/conversation/session-runtime.ts \
            src/components/ConversationViewport.vue \
            src/components/AgentWorkspace.vue \
            tests/session-kernel.test.ts \
            tests/projection-engine.test.ts \
            tests/synthetic.test.ts \
            e2e/layout-integrity.spec.ts \
            e2e/million-message.spec.ts \
            README.md \
            docs/template-review.md \
            docs/agent-workspace-reference-architecture.md \
            docs/verification.md
          git commit -m "refactor: harden agent conversation framework semantics"
          git push origin "HEAD:${GITHUB_EVENT_PATH:+${{ github.event.pull_request.head.ref }}}"

  validate:
    needs: patch-framework
    if: always() && (needs.patch-framework.result == 'success' || needs.patch-framework.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Unit tests
        run: pnpm test

      - name: Typecheck and build
        run: pnpm build

      - name: Chromium UX/stress gate against local build
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Pages artifact
        run: pnpm exec vite build
        env:
          GITHUB_PAGES: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site with the full Chromium suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: pnpm test:e2e

      - name: Upload deployed-site Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-playwright-report
          path: playwright-report/
          retention-days: 7
