name: Deploy GitHub Pages

on:
  push:
    branches: [main, feat/million-message-lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy-and-verify:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
          cache: true
          cache_dependency_path: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Verify architecture tests
        run: pnpm test

      - name: Build for Pages
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run full Chromium UX suite against deployed site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: pnpm test:e2e

      - name: Upload deployed-site Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Publish Pages public-E2E commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          description='deployed Pages passed full Chromium suite'
          if [ "$JOB_STATUS" != 'success' ]; then
            state=failure
            description='Pages deploy or deployed-site Chromium suite failed'
          fi
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"state":"%s","context":"pages-public-e2e","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
